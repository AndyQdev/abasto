type Mutation
  @join__type(graph: CATALOGO)
  @join__type(graph: COBROS)
  @join__type(graph: PEDIDOS)
{
  pedirSerCliente(mayoristaId: ID!): RelacionComercial! @join__field(graph: CATALOGO)
  aprobarCliente(tiendaId: ID!, lista: ListaDePrecios!): RelacionComercial! @join__field(graph: CATALOGO)
  rechazarCliente(tiendaId: ID!): RelacionComercial! @join__field(graph: CATALOGO)

  """
  Lo usa Abasto Campo a través de Conecta. El producto entra como pendiente de revisión.
  """
  cargarProducto(entrada: CargarProductoEntrada!): Producto! @join__field(graph: CATALOGO)

  """
  El mayorista crea un producto a mano en su Panel. Si empieza sin stock queda SIN_STOCK.
  """
  crearProducto(entrada: CrearProductoEntrada!): Producto! @join__field(graph: CATALOGO)

  """
  El mayorista edita un producto suyo: solo cambian los campos que envía.
  """
  editarProducto(id: ID!, entrada: EditarProductoEntrada!): Producto! @join__field(graph: CATALOGO)

  """
  El mayorista corrige el stock de un producto suyo; el estado se deriva del stock.
  """
  ajustarStock(id: ID!, stock: Int!): Producto! @join__field(graph: CATALOGO)

  """
  Paso 3 de la saga de compra. Lo usa el orquestador de Pedidos; repetirlo con el mismo pedido no descuenta dos veces.
  """
  autorizarCredito(entrada: AutorizarCreditoEntrada!): AutorizacionDeCredito! @join__field(graph: COBROS)

  """
  Solo en desarrollo y en la demo (QR_DE_PRUEBA=si): simula que la tienda pagó el QR.
  Con un banco real, el pago lo avisa el banco.
  """
  pagarQrDePrueba(pedidoId: ID!): CobroQr! @join__field(graph: COBROS)

  """
  Paso 1 de la saga de compra. La clave la genera la app una sola vez:
  repetir la mutación con la misma clave devuelve el mismo pedido.
  """
  crearPedido(entrada: CrearPedidoEntrada!): Pedido! @join__field(graph: PEDIDOS)

  """Paso 4 de la saga: el mayorista acepta."""
  confirmarPedido(id: ID!): Pedido! @join__field(graph: PEDIDOS)

  """El mayorista rechaza: se devuelve el cobro y se libera el stock."""
  rechazarPedido(id: ID!, motivo: String!): Pedido! @join__field(graph: PEDIDOS)

  """
  Después de confirmar, de a un paso: CONFIRMADO → EN_PREPARACION → DESPACHADO → ENTREGADO.
  """
  avanzarEntrega(id: ID!): Pedido! @join__field(graph: PEDIDOS)
}

