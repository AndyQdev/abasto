# Abasto en Google Cloud (Compute Engine e2-standard-2: 2 vCPU, 8 GB; Ubuntu 24.04; región us-central1, Iowa).
# Aquí vive la puerta de entrada: Keycloak (sesión), Apollo Router y las webs, más el Catálogo con su Mongo.
# Pedidos, Cobros, Asistente, Postgres y RabbitMQ están en Azure; Conecta, DynamoDB y n8n en AWS.
#
# Cada módulo es su propio contenedor: se actualiza uno sin tocar los demás.
#   docker compose up -d --build catalogo     → solo el Catálogo
#   docker compose restart web-inteligencia   → solo el microfrontend de Inteligencia (el Shell lee remotos.json al abrir)
#
# Paso a paso, problemas y cómo borrar: docs/despliegue.md. Las claves van en .env (copia .env.example), nunca en el repo.

name: abasto-gcp

x-salud: &salud
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 180s
  start_interval: 2s

x-web: &web
  image: caddy:2.10-alpine
  mem_limit: 48m
  restart: unless-stopped
  command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]

services:
  # ---------------------------------------------------------------- entrada HTTPS
  # Caddy saca los certificados de Let's Encrypt solo y reparte por subdominio (sslip.io: la IP es el dominio)
  caddy:
    image: caddy:2.10-alpine
    mem_limit: 96m
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data

  # ---------------------------------------------------------------- sesión
  keycloak_db:
    image: postgres:17-alpine
    mem_limit: 192m
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_CLAVE:?falta KEYCLOAK_DB_CLAVE}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      <<: *salud

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    mem_limit: 896m
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_CLAVE:?falta KEYCLOAK_ADMIN_CLAVE}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_CLAVE}
      # Emisor público de los tokens; los contenedores de aquí lo llaman por dentro (keycloak:8080)
      KC_HOSTNAME: https://auth.${DOMINIO}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65"
    volumes:
      - ../../keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak_db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      <<: *salud

  # ---------------------------------------------------------------- GraphQL federado
  router:
    image: ghcr.io/apollographql/router:v2.7.0
    mem_limit: 256m
    restart: unless-stopped
    command: ["--config", "/despliegue/router.yaml", "--supergraph", "/config/supergraph.graphql", "--hot-reload"]
    environment:
      DOMINIO: ${DOMINIO}
      # Pedidos y Cobros viven en Azure; el Catálogo, aquí al lado
      PEDIDOS_URL: https://pedidos.${DOMINIO_AZURE:?falta DOMINIO_AZURE}/graphql
      COBROS_URL: https://cobros.${DOMINIO_AZURE}/graphql
      CATALOGO_URL: http://catalogo:8082/graphql
      APOLLO_TELEMETRY_DISABLED: "true"
    volumes:
      - ../../router:/config:ro
      - ./router.yaml:/despliegue/router.yaml:ro

  # ---------------------------------------------------------------- Catálogo (Laravel) y su base
  # Réplica de un nodo: sin réplica no hay transacciones (las reservas de stock las usan)
  mongo:
    # 9.0: mongo 8.0 no arranca con kernels 6.19+ (el de Ubuntu 24.04 en Google Cloud), igual que en la CI
    image: mongo:9.0
    mem_limit: 512m
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      <<: *salud

  catalogo:
    build: { context: ../../../services/catalogo, target: dev }
    mem_limit: 512m
    restart: unless-stopped
    # La API y, al lado, la escucha de RabbitMQ (la saga: reservar y liberar stock). La semilla la corre preparar.sh
    command:
      - sh
      - -c
      - >-
        [ -f .env ] || cp .env.example .env;
        (while true; do php artisan catalogo:escuchar; sleep 3; done) &
        exec php -S 0.0.0.0:8082 -t public public/index.php
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${CATALOGO_APP_KEY:?falta CATALOGO_APP_KEY}
      APP_URL: https://catalogo.${DOMINIO}
      LOG_LEVEL: warning
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      # RabbitMQ está en Azure; su firewall solo deja entrar a esta IP y a la de AWS
      RABBITMQ_HOST: ${RABBITMQ_HOST:?falta RABBITMQ_HOST}
      RABBITMQ_PUERTO: "5672"
      RABBITMQ_USUARIO: abasto
      RABBITMQ_CLAVE: ${RABBITMQ_CLAVE:?falta RABBITMQ_CLAVE}
      KEYCLOAK_ISSUER: https://auth.${DOMINIO}/realms/abasto
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/abasto/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CUENTAS_SECRETO: ${KEYCLOAK_CUENTAS_SECRETO:?falta KEYCLOAK_CUENTAS_SECRETO}
      # Demo: el código para entrar con el celular lo muestra la app (no hay WhatsApp conectado)
      CODIGOS_DE_PRUEBA: "true"
      FOTOS_URL: https://catalogo.${DOMINIO}/fotos
      ORIGENES_PERMITIDOS: https://panel.${DOMINIO},https://gestion.${DOMINIO},https://inteligencia.${DOMINIO},https://superadmin.${DOMINIO}
      PHP_CLI_SERVER_WORKERS: "4"
    # RabbitMQ está en otra nube: el firewall de Google corta las conexiones TCP quietas a los 10 min.
    # Con keepalive cada 60 s (activado en el código) la conexión de la saga nunca queda quieta
    sysctls:
      net.ipv4.tcp_keepalive_time: 60
      net.ipv4.tcp_keepalive_intvl: 10
      net.ipv4.tcp_keepalive_probes: 6
    volumes:
      - fotos:/app/storage/app/public/fotos
    depends_on:
      mongo: { condition: service_healthy }
      keycloak: { condition: service_started }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8082/salud') ? 0 : 1);"]
      <<: *salud

  # ---------------------------------------------------------------- webs (cada microfrontend por separado)
  # Lo que sirven lo arma `node infra/despliegue/construir-webs.mjs` en tu máquina y se sube a ./webs
  web-shell:
    <<: *web
    volumes: ["./web.Caddyfile:/etc/caddy/Caddyfile:ro", "./webs/shell:/srv:ro"]
  web-gestion:
    <<: *web
    volumes: ["./web.Caddyfile:/etc/caddy/Caddyfile:ro", "./webs/gestion:/srv:ro"]
  web-inteligencia:
    <<: *web
    volumes: ["./web.Caddyfile:/etc/caddy/Caddyfile:ro", "./webs/inteligencia:/srv:ro"]
  web-superadmin:
    <<: *web
    volumes: ["./web.Caddyfile:/etc/caddy/Caddyfile:ro", "./webs/superadmin:/srv:ro"]

volumes:
  caddy_datos:
  keycloak_db:
  mongo:
  fotos:
