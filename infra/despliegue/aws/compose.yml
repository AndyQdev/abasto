# Abasto en AWS (EC2 m7i-flex.large, Ubuntu 24.04, región us-east-2 Ohio).
# Aquí vive la entrada desde afuera: Conecta (API pública, tiempo real) con DynamoDB de AWS, y n8n (WhatsApp, agentes).
# Keycloak, el Router, las webs y el Catálogo están en Google Cloud; Pedidos, Cobros, Asistente, Postgres y RabbitMQ en Azure.
#
# Cada módulo es su propio contenedor: se actualiza uno sin tocar los demás.
#   docker compose up -d --build conecta      → solo Conecta
#
# Paso a paso, problemas y cómo borrar: docs/despliegue.md. Las claves van en .env (copia .env.example), nunca en el repo.

name: abasto-aws

x-salud: &salud
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 180s
  start_interval: 2s

services:
  # ---------------------------------------------------------------- entrada HTTPS
  # Caddy saca los certificados de Let's Encrypt solo y reparte por subdominio (sslip.io: la IP es el dominio)
  caddy:
    image: caddy:2.10-alpine
    mem_limit: 96m
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data

  # ---------------------------------------------------------------- API pública y tiempo real
  conecta:
    build: { context: ../../.., dockerfile: services/conecta/Dockerfile }
    mem_limit: 256m
    restart: unless-stopped
    environment:
      # "aws": DynamoDB de verdad; la región y las credenciales salen del rol IAM de la máquina
      DYNAMODB_URL: aws
      AWS_REGION: ${AWS_REGION:-us-east-2}
      # El Router y Keycloak están en Google Cloud
      ROUTER_URL: https://api.${DOMINIO_GCP:?falta DOMINIO_GCP}/
      KEYCLOAK_ISSUER: https://auth.${DOMINIO_GCP}/realms/abasto
      KEYCLOAK_JWKS_URL: https://auth.${DOMINIO_GCP}/realms/abasto/protocol/openid-connect/certs
      KEYCLOAK_URL: https://auth.${DOMINIO_GCP}
      KEYCLOAK_CONECTA_SECRETO: ${KEYCLOAK_CONECTA_SECRETO:?falta KEYCLOAK_CONECTA_SECRETO}
      ORIGENES_PERMITIDOS: https://panel.${DOMINIO_GCP},https://superadmin.${DOMINIO_GCP},https://inteligencia.${DOMINIO_GCP}
      # RabbitMQ está en Azure. Sin él la API sigue y reintenta cada 5 s
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      WEBHOOKS_PERMITIR_LOCAL: ""
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/salud"]
      <<: *salud

  # ---------------------------------------------------------------- automatización
  n8n:
    image: n8nio/n8n:1.112.0
    mem_limit: 512m
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.${DOMINIO}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMINIO}/
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: America/La_Paz
      TZ: America/La_Paz
      CONECTA_URL: http://conecta:8084
      KEYCLOAK_TOKEN_URL: https://auth.${DOMINIO_GCP}/realms/abasto/protocol/openid-connect/token
      ROUTER_URL: https://api.${DOMINIO_GCP}/
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n:/home/node/.n8n
      - ../../n8n/flujos:/flujos:ro

volumes:
  caddy_datos:
  n8n:
