[project]
name = "abasto-ml"
version = "0.1.0"
description = "Machine learning de Abasto: demanda (supervisado), mora (supervisado), segmentos de tiendas (no supervisado) y visión de productos con TensorFlow."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# TensorFlow pesa ~600 MB: solo lo instala quien entrena (uv sync --group vision) o se usa en Colab
vision = ["tensorflow>=2.18", "pillow>=10"]

[project.scripts]
abasto-ml-nocturno = "abasto_ml.nocturno:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abasto_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # el largo lo maneja ruff format; el SQL y los docstrings quedan legibles
