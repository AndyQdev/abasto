# Subgrafo de Catálogo (Laravel + Lighthouse). Es un contrato: cambiarlo es un PR aparte que aprueba la otra persona.
# El supergrafo lo compone `pnpm supergrafo` junto con Pedidos y Cobros.
# Red privada: el precio solo se resuelve si la tienda de la sesión es cliente aprobada del mayorista.

extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable"])

type Query {
  "Catálogo para la tienda de la sesión: productos de mayoristas verificados."
  productos(busqueda: String, mayoristaId: ID): [Producto!]!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@productos")
  producto(id: ID!): Producto @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@producto")
  "Productos del mayorista de la sesión (Panel)."
  misProductos(busqueda: String): [Producto!]!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@misProductos")
  mayoristas(busqueda: String): [Mayorista!]! @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@mayoristas")
  "Tiendas que pidieron ser clientes del mayorista de la sesión."
  misSolicitudes: [RelacionComercial!]! @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@misSolicitudes")
}

type Mutation {
  pedirSerCliente(mayoristaId: ID!): RelacionComercial!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@pedirSerCliente")
  aprobarCliente(tiendaId: ID!, lista: ListaDePrecios!): RelacionComercial!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@aprobarCliente")
  rechazarCliente(tiendaId: ID!): RelacionComercial!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@rechazarCliente")
  "Lo usa Abasto Campo a través de Conecta. El producto entra como pendiente de revisión."
  cargarProducto(entrada: CargarProductoEntrada!): Producto!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@cargarProducto")
  "El mayorista crea un producto a mano en su Panel. Si empieza sin stock queda SIN_STOCK."
  crearProducto(entrada: CrearProductoEntrada!): Producto!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@crearProducto")
  "El mayorista edita un producto suyo: solo cambian los campos que envía."
  editarProducto(id: ID!, entrada: EditarProductoEntrada!): Producto!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@editarProducto")
  "El mayorista corrige el stock de un producto suyo; el estado se deriva del stock."
  ajustarStock(id: ID!, stock: Int!): Producto!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@ajustarStock")
}

input CargarProductoEntrada {
  "Clave de idempotencia de la bandeja de Campo"
  clave: ID!
  nombre: String!
  rubro: String!
  presentacion: Presentacion!
  unidades: Int!
  precioUnitarioCentavos: Int!
}

"Lo que envía el Panel cuando el mayorista crea un producto a mano."
input CrearProductoEntrada {
  codigo: String!
  nombre: String!
  rubro: String!
  "Detalle que ve la tienda; vacío si no lo escribe"
  descripcion: String
  "Stock inicial; 0 deja el producto SIN_STOCK"
  stock: Int!
  escalas: [EscalaEntrada!]!
  "STOCK si lo tiene en depósito; BAJO_PEDIDO si lo compra cuando entra el pedido (sin stock)"
  abastecimiento: Abastecimiento
  "Horas desde el pedido hasta la entrega"
  entregaHoras: Int
  "Lo que le cuesta cada unidad. Solo lo ve el mayorista"
  costoUnitarioCentavos: Int
  "Dónde lo compra (puesto, mercado o distribuidora). Solo lo ve el mayorista"
  proveedor: String
}

"Edición de un producto por el mayorista: solo cambia lo que envía."
input EditarProductoEntrada {
  nombre: String
  rubro: String
  descripcion: String
  "Deja todas las escalas por estas; las validaciones van por Producto::cambiarEscalas"
  escalas: [EscalaEntrada!]
  "Solo ACTIVO o PAUSADO: SIN_STOCK y PENDIENTE_DE_REVISION se derivan"
  estado: EstadoEditableProducto
  "STOCK si lo tiene en depósito; BAJO_PEDIDO si lo compra cuando entra el pedido (sin stock)"
  abastecimiento: Abastecimiento
  "Horas desde el pedido hasta la entrega"
  entregaHoras: Int
  "Lo que le cuesta cada unidad. Solo lo ve el mayorista"
  costoUnitarioCentavos: Int
  "Dónde lo compra (puesto, mercado o distribuidora). Solo lo ve el mayorista"
  proveedor: String
}

"Una escala de precio: cuántas unidades trae la presentación y cuánto valdrá cada una."
input EscalaEntrada {
  presentacion: Presentacion!
  unidades: Int!
  precioUnitarioCentavos: Int!
}

"El estado que el mayorista fija editando; el resto lo decide el stock."
enum EstadoEditableProducto {
  ACTIVO
  PAUSADO
}

type Producto @key(fields: "id") {
  id: ID!
  codigo: String!
  nombre: String!
  rubro: String!
  descripcion: String!
  stock: Int!
  estado: EstadoProducto!
  mayorista: Mayorista!
  "Precio por volumen. precioUnitario es null si quien consulta no puede ver precios."
  escalas: [Escala!]!
  precioVisible: Boolean!
  abastecimiento: Abastecimiento!
  "Horas desde el pedido hasta la entrega. Null si el mayorista no lo cargó"
  entregaHoras: Int
  "Lo que le cuesta cada unidad al mayorista. Solo lo ve él; null para los demás"
  costoUnitario: Dinero
  "Dónde lo compra. Solo lo ve el mayorista"
  proveedor: String
}

"STOCK: lo tiene en depósito y reservar descuenta stock. BAJO_PEDIDO: se compra cuando entra el pedido."
enum Abastecimiento {
  STOCK
  BAJO_PEDIDO
}

type Escala {
  presentacion: Presentacion!
  "Unidades que trae la presentación"
  cantidad: Int!
  precioUnitario: Dinero
}

type Mayorista @key(fields: "id") {
  id: ID!
  nombre: String!
  ciudad: String!
  verificado: Boolean!
  "PENDIENTE, VERIFICADO o RECHAZADO"
  estadoVerificacion: String!
  "Relación de la tienda de la sesión con este mayorista"
  relacion: EstadoRelacion!
  "Abasto mismo vendiendo: cualquier tienda registrada ve sus precios sin pedir ser cliente"
  deLaCasa: Boolean!
}

type Tienda @key(fields: "id") {
  id: ID!
  nombre: String!
  ciudad: String!
}

type RelacionComercial {
  tienda: Tienda!
  mayorista: Mayorista!
  estado: EstadoRelacion!
  lista: ListaDePrecios
}

enum Presentacion {
  UNIDAD
  CUARTA
  DOCENA
  CAJA
  FARDO
}

enum EstadoProducto {
  ACTIVO
  PAUSADO
  SIN_STOCK
  PENDIENTE_DE_REVISION
}

enum EstadoRelacion {
  NINGUNA
  SOLICITADA
  APROBADA
  RECHAZADA
}

enum ListaDePrecios {
  NUEVOS
  FRECUENTES
  VIP
}

"Monto en bolivianos. Mismo tipo en los tres subgrafos."
type Dinero @shareable {
  centavos: Int!
  moneda: String!
  texto: String!
}
