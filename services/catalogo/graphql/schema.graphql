# Subgrafo de Catálogo (Laravel + Lighthouse). Es un contrato: cambiarlo es un PR aparte que aprueba la otra persona.
# El supergrafo lo compone `pnpm supergrafo` junto con Pedidos y Cobros.
# Red privada: el precio solo se resuelve si la tienda de la sesión es cliente aprobada del mayorista.

extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable"])

type Query {
  "Catálogo para la tienda de la sesión: productos de mayoristas verificados."
  productos(busqueda: String, mayoristaId: ID): [Producto!]!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@productos")
  producto(id: ID!): Producto @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@producto")
  "Productos del mayorista de la sesión (Panel)."
  misProductos(busqueda: String): [Producto!]!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@misProductos")
  mayoristas(busqueda: String): [Mayorista!]! @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@mayoristas")
  "Tiendas que pidieron ser clientes del mayorista de la sesión."
  misSolicitudes: [RelacionComercial!]! @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@misSolicitudes")
  "CU-04: las tiendas que el mayorista de la sesión ya aprobó, con su lista de precios."
  misClientes: [RelacionComercial!]! @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@misClientes")
  "La empresa de la sesión, con su verificación (el Panel muestra «en revisión» o el motivo del rechazo)."
  miOrganizacion: MiOrganizacion! @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@miOrganizacion")
  "App de clientes: para qué compra (hogar, tienda o productor). Null si todavía no eligió."
  miTipoDeNegocio: NegocioDelCliente @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@miTipoDeNegocio")
  "Solo admin (Superadmin): mayoristas en ese estado, los registrados más recientemente primero."
  mayoristasPorVerificar(estado: String = "PENDIENTE"): [SolicitudDeMayorista!]!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@mayoristasPorVerificar")
}

type Mutation {
  "Público. App de clientes: manda un código de 6 dígitos al celular. En modo prueba vuelve en codigoDePrueba."
  pedirCodigo(telefono: String!): EnvioDeCodigo! @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@pedirCodigo")
  "Público. Con el código correcto entra; la primera vez pide el nombre (error NECESITA_NOMBRE) y crea la cuenta."
  entrarConCodigo(telefono: String!, codigo: String!, nombre: String): SesionDeCliente!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@entrarConCodigo")
  "App de clientes: elige o cambia para qué compra. tipo: hogar, tienda o productor; subtipo (solo productor): salteneria, panaderia, horneados, pension, polleria o puesto."
  elegirTipoDeNegocio(tipo: String!, subtipo: String): NegocioDelCliente!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@elegirTipoDeNegocio")
  "Público. Un mayorista se registra (CU-01) y queda PENDIENTE hasta que Abasto lo verifica."
  registrarMayorista(entrada: RegistrarMayoristaEntrada!): SolicitudDeMayorista!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@registrarMayorista")
  "Solo admin: verifica al mayorista; desde ahí sus productos salen en la app."
  verificarMayorista(id: ID!): SolicitudDeMayorista! @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@verificarMayorista")
  "Solo admin: rechaza al mayorista con un motivo que él ve en su Panel."
  rechazarMayorista(id: ID!, motivo: String!): SolicitudDeMayorista! @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@rechazarMayorista")
  pedirSerCliente(mayoristaId: ID!): RelacionComercial!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@pedirSerCliente")
  aprobarCliente(tiendaId: ID!, lista: ListaDePrecios!): RelacionComercial!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@aprobarCliente")
  rechazarCliente(tiendaId: ID!): RelacionComercial!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@rechazarCliente")
  "Lo usa Abasto Campo a través de Conecta. El producto entra como pendiente de revisión."
  cargarProducto(entrada: CargarProductoEntrada!): Producto!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@cargarProducto")
  "El mayorista crea un producto a mano en su Panel. Si empieza sin stock queda SIN_STOCK."
  crearProducto(entrada: CrearProductoEntrada!): Producto!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@crearProducto")
  "El mayorista edita un producto suyo: solo cambian los campos que envía."
  editarProducto(id: ID!, entrada: EditarProductoEntrada!): Producto!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@editarProducto")
  "El mayorista corrige el stock de un producto suyo; el estado se deriva del stock."
  ajustarStock(id: ID!, stock: Int!): Producto!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@ajustarStock")
  "El mayorista le pone o le cambia la foto a un producto suyo. imagen: JPG, PNG o WebP en base64 (o data URL), hasta 1,4 MB."
  cambiarFotoDeProducto(id: ID!, imagen: String!): Producto!
    @field(resolver: "Catalogo\\Infraestructura\\GraphQL\\Resolutores@cambiarFotoDeProducto")
}

input CargarProductoEntrada {
  "Clave de idempotencia de la bandeja de Campo"
  clave: ID!
  nombre: String!
  rubro: String!
  presentacion: Presentacion!
  unidades: Int!
  precioUnitarioCentavos: Int!
}

"Lo que envía el Panel cuando el mayorista crea un producto a mano."
input CrearProductoEntrada {
  codigo: String!
  nombre: String!
  rubro: String!
  "Detalle que ve la tienda; vacío si no lo escribe"
  descripcion: String
  "Stock inicial; 0 deja el producto SIN_STOCK"
  stock: Int!
  escalas: [EscalaEntrada!]!
  "STOCK si lo tiene en depósito; BAJO_PEDIDO si lo compra cuando entra el pedido (sin stock)"
  abastecimiento: Abastecimiento
  "Horas desde el pedido hasta la entrega"
  entregaHoras: Int
  "Lo que le cuesta cada unidad. Solo lo ve el mayorista"
  costoUnitarioCentavos: Int
  "Dónde lo compra (puesto, mercado o distribuidora). Solo lo ve el mayorista"
  proveedor: String
  "A quién se le muestra en el Inicio de la app (ver Producto.usos)"
  usos: [String!]
}

"Edición de un producto por el mayorista: solo cambia lo que envía."
input EditarProductoEntrada {
  nombre: String
  rubro: String
  descripcion: String
  "Deja todas las escalas por estas; las validaciones van por Producto::cambiarEscalas"
  escalas: [EscalaEntrada!]
  "Solo ACTIVO o PAUSADO: SIN_STOCK y PENDIENTE_DE_REVISION se derivan"
  estado: EstadoEditableProducto
  "STOCK si lo tiene en depósito; BAJO_PEDIDO si lo compra cuando entra el pedido (sin stock)"
  abastecimiento: Abastecimiento
  "Horas desde el pedido hasta la entrega"
  entregaHoras: Int
  "Lo que le cuesta cada unidad. Solo lo ve el mayorista"
  costoUnitarioCentavos: Int
  "Dónde lo compra (puesto, mercado o distribuidora). Solo lo ve el mayorista"
  proveedor: String
  "Deja los usos en estos (lista vacía: no se muestra en ningún Inicio)"
  usos: [String!]
}

"Una escala de precio: cuántas unidades trae la presentación y cuánto valdrá cada una."
input EscalaEntrada {
  presentacion: Presentacion!
  unidades: Int!
  precioUnitarioCentavos: Int!
}

"El estado que el mayorista fija editando; el resto lo decide el stock."
enum EstadoEditableProducto {
  ACTIVO
  PAUSADO
}

type Producto @key(fields: "id") {
  id: ID!
  codigo: String!
  nombre: String!
  rubro: String!
  descripcion: String!
  stock: Int!
  estado: EstadoProducto!
  mayorista: Mayorista!
  "Precio por volumen. precioUnitario es null si quien consulta no puede ver precios."
  escalas: [Escala!]!
  precioVisible: Boolean!
  abastecimiento: Abastecimiento!
  "Horas desde el pedido hasta la entrega. Null si el mayorista no lo cargó"
  entregaHoras: Int
  "Lo que le cuesta cada unidad al mayorista. Solo lo ve él; null para los demás"
  costoUnitario: Dinero
  "Dónde lo compra. Solo lo ve el mayorista"
  proveedor: String
  "URL pública de la foto del producto. Null si todavía no tiene"
  foto: String
  "La marca (PIL, Fino…). Null si no se cargó"
  marca: String
  "La marca es boliviana (verificado)"
  marcaBoliviana: Boolean!
  "Lo que cuesta una unidad al público en un supermercado, para comparar. Null si no se tomó"
  precioEnSuper: PrecioDeReferencia
  "El precio es de demostración: todavía no se cotizó en el mercado"
  precioPorConfirmar: Boolean!
  "A quién se le muestra en el Inicio de la app: hogar, tienda, salteneria, panaderia, horneados, pension, polleria o puesto. Buscar encuentra todo"
  usos: [String!]!
}

"Un precio al público tomado de un supermercado, con dónde y cuándo"
type PrecioDeReferencia {
  precio: Dinero!
  "Fidalga, Amarket…"
  donde: String!
  "aaaa-mm-dd"
  fecha: String!
}

"STOCK: lo tiene en depósito y reservar descuenta stock. BAJO_PEDIDO: se compra cuando entra el pedido."
enum Abastecimiento {
  STOCK
  BAJO_PEDIDO
}

type Escala {
  presentacion: Presentacion!
  "Unidades que trae la presentación"
  cantidad: Int!
  precioUnitario: Dinero
}

type Mayorista @key(fields: "id") {
  id: ID!
  nombre: String!
  ciudad: String!
  verificado: Boolean!
  "PENDIENTE, VERIFICADO o RECHAZADO"
  estadoVerificacion: String!
  "Relación de la tienda de la sesión con este mayorista"
  relacion: EstadoRelacion!
  "Abasto mismo vendiendo: cualquier tienda registrada ve sus precios sin pedir ser cliente"
  deLaCasa: Boolean!
  "Mayorista de demostración (e2e y casos de uso del parcial): la app de clientes no lo muestra"
  dePrueba: Boolean!
}

"Lo que recibe la app al pedir el código."
type EnvioDeCodigo {
  "591 + los 8 dígitos"
  telefono: String!
  "Primera vez con este celular: después del código la app pide el nombre"
  esNuevo: Boolean!
  venceEnSegundos: Int!
  "Solo mientras no está WhatsApp: el código, para mostrarlo en la app"
  codigoDePrueba: String
}

"La sesión de la app de clientes. La app la guarda y la renueva sola con tokenDeRenovacion."
type SesionDeCliente {
  tokenDeAcceso: String!
  tokenDeRenovacion: String!
  venceEnSegundos: Int!
  "Recién creó su cuenta"
  cuentaNueva: Boolean!
  nombre: String!
}

type MiOrganizacion {
  id: ID!
  nombre: String!
  "mayorista o tienda"
  tipo: String!
  "PENDIENTE, VERIFICADO o RECHAZADO"
  estadoVerificacion: String!
  motivoRechazo: String
  "Solo clientes de la app: para qué compra. Null en los mayoristas y en quien no eligió."
  negocio: NegocioDelCliente
}

"Para qué compra el cliente de la app (docs/plan-mi-negocio.md). Queda en su organización: se lee en cualquier celular."
type NegocioDelCliente {
  "hogar, tienda o productor"
  tipo: String!
  "Solo productor: salteneria, panaderia, horneados, pension, polleria o puesto"
  subtipo: String
  "Cuándo lo eligió o lo cambió (ISO 8601)"
  elegidoEn: String!
}

"Un mayorista tal como lo revisa Abasto en el Superadmin."
type SolicitudDeMayorista {
  id: ID!
  nombre: String!
  nit: String
  ciudad: String!
  representante: String
  telefono: String
  correo: String
  "PENDIENTE, VERIFICADO o RECHAZADO"
  estadoVerificacion: String!
  motivoRechazo: String
  "ISO 8601; null en los de la semilla"
  registradaEn: String
}

input RegistrarMayoristaEntrada {
  empresa: String!
  nit: String!
  ciudad: String!
  representante: String!
  telefono: String!
  correo: String!
  clave: String!
}

type Tienda @key(fields: "id") {
  id: ID!
  nombre: String!
  ciudad: String!
  "Para qué compra (hogar, tienda o productor). Null si todavía no eligió."
  negocio: NegocioDelCliente
}

type RelacionComercial {
  tienda: Tienda!
  mayorista: Mayorista!
  estado: EstadoRelacion!
  lista: ListaDePrecios
}

enum Presentacion {
  UNIDAD
  CUARTA
  DOCENA
  CAJA
  FARDO
}

enum EstadoProducto {
  ACTIVO
  PAUSADO
  SIN_STOCK
  PENDIENTE_DE_REVISION
}

enum EstadoRelacion {
  NINGUNA
  SOLICITADA
  APROBADA
  RECHAZADA
}

enum ListaDePrecios {
  NUEVOS
  FRECUENTES
  VIP
}

"Monto en bolivianos. Mismo tipo en los tres subgrafos."
type Dinero @shareable {
  centavos: Int!
  moneda: String!
  texto: String!
}
