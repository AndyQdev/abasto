# Pedidos · Spring Boot. Valores por defecto para correr en tu máquina con `pnpm infra`;
# dentro de Docker los cambia docker-compose.yml con variables de entorno.
server:
  port: ${PORT:8081}

spring:
  application:
    name: pedidos
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PUERTO:5440}/pedidos
    username: ${DB_USUARIO:pedidos}
    password: ${DB_CLAVE:pedidos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PUERTO:5680}
    username: abasto
    password: abasto
    listener:
      simple:
        default-requeue-rejected: true
  graphql:
    schema:
      locations: classpath:graphql/
    graphiql:
      enabled: true

abasto:
  keycloak:
    emisor: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/abasto}
    jwks: ${KEYCLOAK_JWKS_URL:http://localhost:8180/realms/abasto/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

---
# Perfil demo: carga los pedidos de las maquetas (db/demo). docker-compose lo activa.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
