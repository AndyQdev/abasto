# Subgrafo de Cobros. Es un contrato: cambiarlo es un PR aparte que aprueba la otra persona.
# El supergrafo lo compone `pnpm supergrafo` junto con Pedidos y Catálogo.

extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable"])

type Query {
  "Crédito que un mayorista le dio a una tienda. Null si no tiene. Solo lo ven esa tienda y ese mayorista."
  lineaDeCredito(tiendaId: ID!, mayoristaId: ID!): LineaDeCredito
  "CU-04: los créditos que dio el mayorista con sesión."
  misCreditosDados: [LineaDeCredito!]!
  "El cobro por QR de un pedido. Solo lo ven la tienda que compra y el mayorista que vende."
  cobroDePedido(pedidoId: ID!): CobroQr
  """
  «Mi negocio» del cliente con sesión (docs/plan-mi-negocio.md): todo (desde vacío, por ejemplo un celular nuevo)
  o lo recibido después de la marca `desde`, que es el `hasta` de la bajada anterior.
  """
  miNegocio(desde: String): MiNegocio!
  """
  CU-09: lo que le deben al mayorista con sesión (pedidos a crédito o contra entrega), lo más atrasado primero.
  Las pagadas solo si se piden.
  """
  cuentasPorCobrar(conPagadas: Boolean = false): CuentasPorCobrar!
}

type Mutation {
  """
  CU-04: el mayorista con sesión le da crédito a una tienda o cambia el que tiene. Límite 0 quita el cupo;
  no puede quedar por debajo de lo que la tienda ya usó. El plazo es de 15 o 30 días.
  """
  asignarCredito(entrada: AsignarCreditoEntrada!): LineaDeCredito!
  "Paso 3 de la saga de compra. Lo usa el orquestador de Pedidos; repetirlo con el mismo pedido no descuenta dos veces."
  autorizarCredito(entrada: AutorizarCreditoEntrada!): AutorizacionDeCredito!
  """
  Solo en desarrollo y en la demo (QR_DE_PRUEBA=si): simula que la tienda pagó el QR.
  Con un banco real, el pago lo avisa el banco.
  """
  pagarQrDePrueba(pedidoId: ID!): CobroQr!
  """
  El teléfono sube lo que hizo (sin señal o con señal). Todo o nada, y repetirlo no duplica: lo que solo se agrega
  entra una vez y lo editable gana si su actualizadoEn es igual o más nuevo.
  """
  sincronizarMiNegocio(cambios: CambiosDeNegocioEntrada!): ResultadoDeSincronizacion!
  """
  CU-09: el mayorista anota lo que la tienda le pagó (todo o una parte). El pagoId lo genera quien registra:
  repetirlo (doble toque o reenvío sin señal) no cobra dos veces. Al saldar un crédito, la tienda recupera el cupo.
  """
  registrarPago(entrada: RegistrarPagoEntrada!): CuentaPorCobrar!
}

input AsignarCreditoEntrada {
  tiendaId: ID!
  limiteCentavos: Int!
  plazoDias: Int!
}

input AutorizarCreditoEntrada {
  tiendaId: ID!
  mayoristaId: ID!
  pedidoId: ID!
  centavos: Int!
}

type LineaDeCredito @key(fields: "id") {
  id: ID!
  tienda: Tienda!
  mayoristaId: ID!
  limite: Dinero!
  usado: Dinero!
  disponible: Dinero!
  plazoDias: Int!
}

type AutorizacionDeCredito {
  lineaId: ID!
  pedidoId: ID!
  autorizado: Dinero!
  disponible: Dinero!
}

type CobroQr {
  pedidoId: ID!
  monto: Dinero!
  estado: EstadoCobroQr!
  "Lo que lleva el QR. En la demo es un texto simulado."
  codigo: String!
  venceEn: String!
  pagadoEn: String
}

enum EstadoCobroQr {
  PENDIENTE
  PAGADO
  VENCIDO
  DEVUELTO
  ANULADO
}

"El pedido es de Pedidos; Cobros le agrega su cobro (federación)."
type Pedido @key(fields: "id") {
  id: ID!
  "Null si se paga a crédito o si todavía no se generó el QR."
  cobro: CobroQr
}

"Monto en bolivianos. Mismo tipo en los tres subgrafos."
type Dinero @shareable {
  centavos: Int!
  moneda: String!
  texto: String!
}

# ─── CU-09 · Cuentas por cobrar (03/11)

type CuentasPorCobrar {
  "Lo que falta cobrar, sumado."
  porCobrar: Dinero!
  "De eso, lo que ya pasó la fecha."
  vencido: Dinero!
  "Cuántas tiendas deben algo."
  tiendas: Int!
  cuentas: [CuentaPorCobrar!]!
}

"Lo que una tienda debe por un pedido. Una por pedido."
type CuentaPorCobrar {
  id: ID!
  pedidoId: ID!
  "El código que ve la gente (A-1042)."
  codigo: String!
  tienda: Tienda!
  origen: OrigenDeCuenta!
  monto: Dinero!
  pagado: Dinero!
  saldo: Dinero!
  estado: EstadoDeCuenta!
  abiertaEn: String!
  "Null en contra entrega: se cobra al entregar."
  venceEn: String
  "0 si no venció (o ya está pagada)."
  diasDeAtraso: Int!
  pagos: [PagoDeCuenta!]!
}

type PagoDeCuenta {
  id: ID!
  monto: Dinero!
  forma: FormaDePago!
  nota: String
  registradoEn: String!
}

input RegistrarPagoEntrada {
  pagoId: ID!
  pedidoId: ID!
  centavos: Int!
  forma: FormaDePago!
  nota: String
}

enum OrigenDeCuenta {
  CREDITO
  CONTRA_ENTREGA
}

enum EstadoDeCuenta {
  PENDIENTE
  PARCIAL
  PAGADA
}

enum FormaDePago {
  EFECTIVO
  TRANSFERENCIA
  QR
}

"La tienda es de Catálogo; aquí solo se referencia."
type Tienda @key(fields: "id", resolvable: false) {
  id: ID!
}

# ─── «Mi negocio» (módulo src/mi-negocio, esquema negocio). Los campos son los de packages/comercio/src/mi-negocio/modelo.ts.
# Montos en centavos (Int); cantidades en Float (en la base, numeric(14,6)); fechas en ISO 8601.

type MiNegocio {
  articulos: [ArticuloDeNegocio!]!
  movimientos: [MovimientoDeNegocio!]!
  ventas: [VentaDeNegocio!]!
  clientes: [ClienteDeFiado!]!
  fiados: [MovimientoDeFiado!]!
  recetas: [RecetaDeNegocio!]!
  tandas: [TandaDeNegocio!]!
  anotaciones: [AnotacionDeNegocio!]!
  lista: [ItemDeListaFija!]!
  "La marca para la próxima bajada: miNegocio(desde: hasta)"
  hasta: String!
}

type ResultadoDeSincronizacion {
  recibidos: Int!
  hasta: String!
}

enum ClaseDeArticulo {
  COMPRADO
  HECHO
}

enum OrigenDeArticulo {
  ABASTO
  OTRO_PROVEEDOR
}

enum TipoDeMovimiento {
  ENTRADA
  SALIDA
  AJUSTE
  CONSUMO
  PRODUCCION
  VENTA
  MERMA
}

enum OrigenDeMovimiento {
  ABASTO
  OTRO_PROVEEDOR
  MANUAL
  VENTA
  TANDA
}

enum FormaDeCobro {
  CONTADO
  FIADO
}

enum TipoDeFiado {
  DEBE
  PAGA
}

enum TipoDeAnotacion {
  INGRESO
  GASTO
}

enum OrigenDeAnotacion {
  MANUAL
  ABASTO
}

"En qué se cuenta: 1 quintal = 46 kg; porEnvase es null si no se sabe"
type MedidaDeNegocio {
  envase: String!
  porEnvase: Float
  unidad: String!
}

type ArticuloDeNegocio {
  id: ID!
