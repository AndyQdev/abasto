  clase: ClaseDeArticulo!
  origen: OrigenDeArticulo!
  productoId: String
  proveedor: String
  precioVentaCentavos: Int
  stockMinimo: Float
  creadoEn: String!
  actualizadoEn: String!
  eliminado: Boolean!
}

type MovimientoDeNegocio {
  id: ID!
  articuloId: String!
  tipo: TipoDeMovimiento!
  "En envases del artículo y con signo: + entra, − sale"
  cantidad: Float!
  costoUnitarioCentavos: Int
  origen: OrigenDeMovimiento!
  claveUnica: String!
  fecha: String!
  nota: String
  ventaId: String
  tandaId: String
}

type LineaDeVentaDeNegocio {
