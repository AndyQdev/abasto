openapi: 3.1.0
info:
  title: Asistente · agentes, reportes generativos y MCP
  version: 1.0.0
  description: Lo usan el Panel (Inteligencia, en Vue) y el Superadmin. El MCP está en POST /mcp (Streamable HTTP).
servers:
  - url: http://localhost:8085
security:
  - keycloak: []
paths:
  /v1/reportes/preguntas:
    post:
      summary: Reporte generativo. La pregunta llega escrita o ya transcrita por Whisper en el navegador.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [texto], properties: { texto: { type: string, minLength: 3, maxLength: 500 } } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  pregunta: { type: string }
                  sql: { type: string }
                  explicacion: { type: string }
                  grafico: { type: string, enum: [tabla, barras, linea] }
                  columnas: { type: array, items: { type: string } }
                  filas: { type: array, items: { type: object } }
                  truncado: { type: boolean, description: true si había más de 1.000 filas }
                  modelo: { type: string, example: simulado }
                  bloques:
                    description: >-
                      (10/11, aditivo) La vista completa, de 1 a 5 bloques. El primero es el de arriba (sql, columnas,
                      filas). Cada bloque es una plantilla que eligió el modelo, ya comprobada contra los datos.
                    type: array
                    items:
                      type: object
                      properties:
                        titulo: { type: string, example: Ventas por semana }
                        sql: { type: string }
                        plantilla: { type: string, enum: [kpis, linea, barras, dona, tabla], description: Con la que se dibuja }
                        pedida: { type: string, enum: [kpis, linea, barras, dona, tabla], description: La que eligió el modelo }
                        aviso: { type: string, description: Si los datos no encajaban en la pedida, por qué se cambió }
                        alternativas: { type: array, items: { type: string }, description: Plantillas en las que también encajan («Ver como») }
                        columnas: { type: array, items: { type: string } }
                        filas: { type: array, items: { type: object } }
                        truncado: { type: boolean }
                  lectura:
                    description: (10/11, aditivo) Lo que el modelo leyó en los resultados; null si no hubo lectura
                    nullable: true
                    type: object
                    properties:
                      hallazgos: { type: array, items: { type: string } }
                      recomendaciones: { type: array, items: { type: string }, description: Solo si la pregunta pedía consejo }
        '400': { description: La consulta generada no pasó la guardia de SQL }
        '422':
          description: >-
            La pregunta es ambigua o no se entendió. message es lo que el Analista pregunta de vuelta;
            opciones (si viene) son preguntas completas que sí sabe responder, para elegir con un toque.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  opciones: { type: array, items: { type: string } }
        '503': { description: El modelo de lenguaje no respondió a tiempo (ya se reintentó una vez); se puede volver a preguntar }
  /v1/reportes/excel:
    post:
      summary: Devuelve el .xlsx de una tabla de reporte, o de varias (una hoja por bloque)
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [columnas, filas]
                  properties:
                    titulo: { type: string }
                    columnas: { type: array, items: { type: string } }
                    filas: { type: array, maxItems: 1000, items: { type: object } }
                - type: object
                  description: (10/11, aditivo) Un reporte de varios bloques
                  required: [hojas]
                  properties:
                    hojas:
                      type: array
                      maxItems: 5
                      items:
                        type: object
                        required: [columnas, filas]
                        properties:
                          titulo: { type: string }
                          columnas: { type: array, items: { type: string } }
                          filas: { type: array, maxItems: 1000, items: { type: object } }
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
  /v1/agentes:
    get:
      summary: Los agentes con su misión, skills y qué requiere aprobación
  /v1/agentes/propuestas:
    get:
      summary: Propuestas pendientes de la empresa de la sesión
  /v1/agentes/{id}/ejecutar:
    post:
      summary: Corre la misión del agente ahora (cobranza, reposicion o catalogo). Solo crea propuestas; no ejecuta nada. Lo que ya espera una decisión no se repite.
  /v1/agentes/monitorear:
    post:
      summary: «Monitorear mi negocio». Corre todas las misiones y devuelve cuántas propuestas nuevas dejó cada agente.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  agentes:
                    type: array
                    items: { type: object, properties: { agenteId: { type: string }, nuevas: { type: integer }, error: { type: string } } }
  /v1/tableros:
    get:
      summary: Tableros de Inteligencia. Demanda prevista con días de stock, segmentos K-means, ventas de 30 días y cobranza.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  demanda:
                    type: array
                    items:
                      type: object
                      properties:
                        producto_id: { type: string }
                        nombre: { type: string }
                        stock: { type: integer }
                        unidades_semana: { type: number }
                        dias_de_stock: { type: number, nullable: true }
                  segmentos:
                    type: array
                    items:
                      type: object
                      properties:
                        segmento: { type: string }
                        tiendas: { type: integer }
                        compras_mes: { type: number }
                        ticket_promedio_centavos: { type: integer }
                  ventas:
                    type: array
                    items: { type: object, properties: { fecha: { type: string, format: date }, total_centavos: { type: integer } } }
                  cobranza:
                    type: object
                    properties:
                      pendiente_centavos: { type: integer }
                      vencida_centavos: { type: integer }
                      cuentas_vencidas: { type: integer }
                      vencen_esta_semana: { type: integer }
  /v1/agentes/propuestas/{id}/decision:
    post:
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [aprobar], properties: { aprobar: { type: boolean } } }
      responses:
        '200':
          description: >-
            La propuesta decidida. Si se aprobó, `ejecucion` dice lo que hizo n8n con la acción
            (flujo `infra/n8n/flujos/acciones-de-agentes.json`), que actúa con la sesión de quien aprobó.
          content:
            application/json:
              schema:
                type: object
                properties:
                  propuesta: { type: object }
                  ejecucion:
                    type: object
                    properties:
                      enviado: { type: boolean }
                      detalle: { type: string }
                      enlace: { type: string, description: 'Por ejemplo, el WhatsApp listo para mandar (wa.me)' }
  /v1/auditoria:
    get:
      summary: Últimas consultas sobre los datos de una empresa. Solo rol admin (Superadmin).
      parameters:
        - { name: orgId, in: query, required: true, schema: { type: string } }
components:
  securitySchemes:
    keycloak:
      type: http
      scheme: bearer
      bearerFormat: JWT
