openapi: 3.1.0
info:
  title: Conecta · la puerta de afuera de Abasto
  version: 1.0.0
  description: |
    Sincronización de la bandeja sin señal de la app, API para e-commerce y n8n, y MCP de compras.
    Toda escritura lleva una clave de idempotencia: repetirla devuelve la misma respuesta y nunca registra dos veces.
    Se entra con el token de Keycloak de la sesión o con una llave de API (`Authorization: Bearer abk_…`) que la tienda
    saca en la app. Una llave actúa como su tienda, con sus precios y sus pedidos, y no puede manejar otras llaves.
servers:
  - url: http://localhost:8084
security:
  - keycloak: []
paths:
  /v1/tiempo-real:
    get:
      summary: Canal WebSocket de la app de la tienda (02/11) — avisos de sus pedidos en tiempo real
      description: >-
        Se abre como WebSocket (ws:// o wss:// al mismo host de Conecta). El primer mensaje de la app es
        `{"tipo":"hola","token":"<token de Keycloak>"}` (el token nunca va en la URL). Si vale y es de una tienda,
        Conecta responde `{"tipo":"listo"}` y desde ahí manda `{"tipo","pedidoId","codigo","ocurridoEn"}` por cada
        pedido.* o cobro.* de esa tienda (sin montos ni líneas: la app vuelve a pedir el pedido por GraphQL).
        Cierres: 4401 sin sesión o inválida (o sin «hola» en 10 s), 4001 el token venció (la app entra con uno nuevo),
        4400 mensaje que no se entiende. Conecta hace ping cada 25 s y corta a quien no contesta.
      security: []
      responses:
        '101': { description: Se cambió a WebSocket }
  /salud:
    get:
      security: []
      responses:
        '200': { description: El servicio responde }
  /v1/sincronizacion/lotes:
    post:
      summary: Aplica en orden lo que juntó una bandeja offline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operaciones]
              properties:
                operaciones:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/Operacion' }
      responses:
        '200':
          description: Un resultado por operación, en el mismo orden
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultados: { type: array, items: { $ref: '#/components/schemas/Resultado' } }
        '400': { description: El lote no cumple el esquema }
        '401': { description: Falta la sesión o venció }
  /v1/llaves:
    get:
      summary: (CU-10) Las llaves de la tienda de la sesión, sin el secreto. No se puede con una llave
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Llave' } }
        '403': { description: No es una tienda o entró con una llave }
    post:
      summary: (CU-10) Saca una llave. El texto completo se muestra solo esta vez. Máximo 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, minLength: 2, maxLength: 60 }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  llave: { type: string, description: 'abk_<id>_<secreto>' }
                  datos: { $ref: '#/components/schemas/Llave' }
        '400': { description: Nombre inválido }
        '409': { description: Ya tiene el máximo de llaves }
  /v1/llaves/{id}:
    delete:
      summary: (CU-10) Revoca la llave. Deja de servir al momento
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revocada }
        '404': { description: No existe o no es de esta tienda }
  /v1/webhooks:
    get:
      summary: (CU-10) A dónde se le avisa a la tienda
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
    post:
      summary: (CU-10) Registra una dirección. El secreto para comprobar la firma se muestra solo esta vez. Máximo 3
      description: >-
        Conecta manda un POST por cada evento pedido.* o cobro.* de la tienda, con el cuerpo
        `{id, tipo, ocurridoEn, datos}` y las cabeceras X-Abasto-Evento, X-Abasto-Entrega (descarta repetidos con ella),
        X-Abasto-Fecha y X-Abasto-Firma (`sha256=` + HMAC-SHA256 de `fecha.cuerpo` con el secreto). Cualquier 2xx es
        entregado; si no, reintenta a los 1, 5, 30, 120 y 720 minutos. Solo https y direcciones públicas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  secreto: { type: string }
                  datos: { $ref: '#/components/schemas/Webhook' }
        '400': { description: Dirección que no se puede usar }
        '409': { description: Ya tiene el máximo de direcciones }
  /v1/webhooks/{id}:
    delete:
      summary: (CU-10) Borra la dirección
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Borrada }
        '404': { description: No existe o no es de esta tienda }
  /v1/webhooks/{id}/probar:
    post:
      summary: (CU-10) Manda un aviso webhook.prueba y responde al momento cómo quedó
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entrega' }
  /v1/entregas:
    get:
      summary: (CU-10) Los últimos 30 avisos de la tienda y cómo quedó cada uno
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Entrega' } }
  /v1/entregas/{id}/reenviar:
    post:
      summary: (CU-10) Vuelve a mandar un aviso que no llegó
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entrega' }
        '404': { description: No existe o no es de esta tienda }
        '409': { description: Ya llegó }
  /v1/admin/integraciones:
    get:
      summary: (CU-10, solo admin) Todas las llaves y direcciones, sin secretos, y los últimos 100 avisos
      responses:
        '200': { description: 'llaves, webhooks y entregas' }
        '403': { description: No es del equipo de Abasto }
  /v1/admin/entregas/{id}/reenviar:
    post:
      summary: (CU-10, solo admin) Reenvía cualquier aviso que no llegó
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entrega' }
  /v1/dispositivos:
    put:
      summary: (10/11, notificaciones push) La app registra el token de Firebase de este teléfono para recibir los avisos de su tienda
      description: >-
        Se llama al entrar y cada vez que Firebase cambia el token. Idempotente: un token es un teléfono; si era de otra
        cuenta, pasa a esta. Una llave de API (CU-10) no puede registrar teléfonos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, plataforma]
              properties:
                token: { type: string, description: Token de Firebase Cloud Messaging del teléfono }
                plataforma: { type: string, enum: [android, ios] }
      responses:
        '200': { description: '{ registrado: true, plataforma }' }
        '400': { description: TOKEN_INVALIDO, PLATAFORMA_INVALIDA o SIN_EMPRESA }
  /v1/dispositivos/{token}:
    delete:
      summary: (10/11) Al cerrar sesión, el teléfono deja de recibir lo de esa tienda. Solo lo quita su misma empresa
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Quitado (o no era de esta empresa) }
  /v1/dispositivos/prueba:
    post:
      summary: '(10/11) «Probar una notificación» de la app, le manda una a los teléfonos de quien la pide'
      responses:
        '200': { description: '{ telefonos, enviadas }' }
  /v1/admin/promociones:
    get:
      summary: (10/11, solo admin) Las últimas 30 promociones enviadas, con a cuántos teléfonos llegaron
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Promocion' } }
    post:
      summary: (10/11, solo admin) Manda una promoción como notificación push a todos los teléfonos con la app
      description: >-
        El Idempotency-Key es el id de la promoción: repetirla (doble clic, red que se corta) devuelve la misma y no
        vuelve a sonar en los teléfonos. Título hasta 60 letras, mensaje hasta 180; productoId opcional (tocarla abre su ficha).
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, mensaje]
              properties:
                titulo: { type: string, maxLength: 60 }
                mensaje: { type: string, maxLength: 180 }
                productoId: { type: string, nullable: true, example: AB-005 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promocion' }
        '400': { description: 'TITULO_REQUERIDO, TITULO_LARGO, MENSAJE_REQUERIDO, MENSAJE_LARGO, PRODUCTO_INVALIDO o FALTA_CLAVE' }
        '403': { description: No es del equipo de Abasto }
  /v1/admin/notificaciones:
    get:
      summary: (10/11, solo admin) Teléfonos registrados, si Firebase está conectado y las últimas 50 notificaciones que salieron
      responses:
        '200': { description: '{ modo: firebase | prueba, telefonos, empresas, recientes: [{ cuando, orgId, titulo, cuerpo, canal, datos, resultado }] }' }
  /v1/mayoristas:
    get:
      summary: (CU-10) A quién le puede comprar esta tienda
      parameters:
        - { name: busqueda, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 'Lista con id, nombre, ciudad, relacion y deLaCasa' }
  /v1/productos:
    get:
      summary: (CU-10) El catálogo con los precios de esta tienda
      parameters:
        - { name: busqueda, in: query, required: false, schema: { type: string } }
        - { name: mayoristaId, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 'Productos con id, nombre, foto, stock, precioVisible, precioPorConfirmar y escalas' }
  /v1/pedidos/{id}:
    get:
      summary: (CU-10) Un pedido de esta tienda con su estado, total, líneas y QR
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: El pedido }
        '404': { description: No existe o no es de esta tienda }
  /mcp:
    post:
      summary: (CU-10) MCP de compras (Streamable HTTP, sin sesión)
      description: >-
        Servidor `abasto-compras` con ver_mayoristas, buscar_productos, crear_pedido (con clave de idempotencia),
        ver_pedido y mis_pedidos. Se entra con una llave de API o el token de una tienda.
      responses:
        '200': { description: Respuesta JSON-RPC }
        '401': { description: Sin credencial o inválida }
        '403': { description: La cuenta no es de una tienda }
  /v1/bitacora:
    get:
      summary: >-
        (03/11, aditivo) Panel › Conecta: los últimos 100 pedidos que entraron de afuera para el mayorista de la sesión
        (WhatsApp, tienda en línea, API o la app sin señal) y qué pasó con cada uno. Se guardan 30 días.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  resumen:
                    type: object
                    properties:
                      aplicadas: { type: integer }
                      repetidas: { type: integer, description: Reintentos que la idempotencia descartó }
                      conProblemas: { type: integer }
                  entradas:
                    type: array
                    items:
                      type: object
                      properties:
                        clave: { type: string, format: uuid }
                        origen: { type: string, enum: [whatsapp, tienda-en-linea, app-sin-senal, api] }
                        estado: { type: string, enum: [aplicada, repetida, conflicto, rechazada] }
                        ocurridoEn: { type: string, format: date-time }
                        tiendaId: { type: string, nullable: true }
                        tiendaNombre: { type: string, nullable: true }
                        codigo: { type: string, nullable: true }
                        total: { type: string, nullable: true, example: 'Bs 120,00' }
                        error: { type: string, nullable: true }
        '401': { description: Falta la sesión o venció }
        '403': { description: La cuenta no pertenece a una empresa }
  /v1/pedidos:
    post:
      summary: Un pedido desde un e-commerce o n8n
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Abasto-Origen
          in: header
          required: false
          description: (03/11, aditivo) De dónde viene, para la bitácora del mayorista. Sin cabecera, «api».
          schema: { type: string, enum: [whatsapp, tienda-en-linea, api, mcp] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosPedido' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resultado' }
        '400': { description: Falta la cabecera Idempotency-Key }
components:
  securitySchemes:
    keycloak:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Promocion:
      type: object
      properties:
        id: { type: string, format: uuid, description: El Idempotency-Key con que se creó }
        titulo: { type: string }
        mensaje: { type: string }
        productoId: { type: string, nullable: true }
        creadaPor: { type: string }
        creadaEn: { type: string, format: date-time }
        destinatarios: { type: integer, description: Teléfonos a los que se intentó mandar }
        enviadas: { type: integer }
        fallidas: { type: integer }
    Llave:
      type: object
      properties:
        id: { type: string }
        nombre: { type: string }
        termina: { type: string, description: Los últimos 4 caracteres, para reconocerla }
        creadaEn: { type: string, format: date-time }
        ultimoUsoEn: { type: string, format: date-time, nullable: true }
    Webhook:
      type: object
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        creadoEn: { type: string, format: date-time }
    Entrega:
      type: object
      properties:
        id: { type: string }
        webhookId: { type: string }
        url: { type: string }
        tipo: { type: string }
        estado: { type: string, enum: [pendiente, entregada, fallida] }
        intentos: { type: integer }
        proximoEn: { type: string, format: date-time, nullable: true }
        ultimoError: { type: string, nullable: true }
        creadaEn: { type: string, format: date-time }
        entregadaEn: { type: string, format: date-time, nullable: true }
    Operacion:
      type: object
      required: [clave, tipo, datos, creadaEn]
      properties:
        clave: { type: string, format: uuid, description: La genera el teléfono una sola vez; no cambia entre reintentos }
        tipo: { type: string, enum: [pedido.crear, producto.cargar] }
        datos:
          oneOf:
            - $ref: '#/components/schemas/DatosPedido'
            - $ref: '#/components/schemas/DatosProducto'
        creadaEn: { type: string, format: date-time }
    DatosPedido:
      type: object
      required: [mayoristaId, metodoPago, lineas]
      properties:
        mayoristaId: { type: string }
        metodoPago: { type: string, enum: [QR, CREDITO, CONTRA_ENTREGA] }
        lineas:
          type: array
          items:
            type: object
            required: [productoId, presentacion, cantidad]
            properties:
              productoId: { type: string }
              presentacion: { type: string, enum: [UNIDAD, CUARTA, DOCENA, CAJA, FARDO] }
              cantidad: { type: integer, minimum: 1 }
        entrega:
          type: object
          description: A dónde llevarlo (la tienda lo marca en el mapa de la app). Opcional para el e-commerce y n8n.
          required: [calle]
          properties:
            calle: { type: string, maxLength: 200 }
            zona: { type: string, maxLength: 200 }
            referencia: { type: string, maxLength: 300 }
            latitud: { type: number, minimum: -90, maximum: 90, nullable: true }
            longitud: { type: number, minimum: -180, maximum: 180, nullable: true }
    DatosProducto:
      type: object
      required: [nombre, rubro, presentacion, unidades, precioUnitarioCentavos]
      properties:
        nombre: { type: string }
        rubro: { type: string }
        presentacion: { type: string, enum: [UNIDAD, CUARTA, DOCENA, CAJA, FARDO] }
        unidades: { type: integer }
        precioUnitarioCentavos: { type: integer }
    Resultado:
      type: object
      required: [clave, estado]
      properties:
        clave: { type: string }
        estado:
          type: string
          enum: [aplicada, repetida, conflicto, rechazada]
          description: |
            aplicada: se aplicó ahora. repetida: ya se había aplicado y se devuelve la misma respuesta.
            conflicto: la misma clave llegó con otro contenido. rechazada: falló; la clave se libera para reintentar.
        respuesta: { description: Lo que devolvió el servicio la primera vez }
        error: { type: string }
