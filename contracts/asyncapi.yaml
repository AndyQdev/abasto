# Eventos y comandos entre servicios (RabbitMQ). Es un contrato: cambiarlo es un PR aparte que aprueba la otra persona.
# Comandos → exchange abasto.comandos (le piden algo a un servicio). Eventos → abasto.eventos (cuentan algo que pasó).
# La routing key es el tipo. Cada mensaje viaja en el mismo sobre y lleva un id único: el consumidor lo registra
# en su tabla de mensajes procesados y, si llega dos veces, no lo aplica de nuevo.
asyncapi: 3.0.0
info:
  title: Abasto · mensajería entre servicios
  version: 1.0.0
  description: >-
    Saga de compra orquestada desde Pedidos, proyector de reportes en Asistente y webhooks de Conecta (cola conecta.webhooks,
    con pedido.* y cobro.*). CU-16 suma pedido.reclamo_abierto y pedido.reclamo_resuelto, con DatosPedido más reclamoId, motivo,
    estadoDelReclamo y devueltoCentavos; solo avisan: la devolución se hace a mano y no mueve Cobros.
    Notificaciones push (10/11): Conecta escucha pedido.* y cobro.* en la cola durable conecta.notificaciones y le avisa a
    los teléfonos de la tienda (datos.tiendaId) en pedido.confirmado, pedido.rechazado, pedido.en_preparacion,
    pedido.despachado (queda fija), pedido.entregado, cobro.qr_pagado y pedido.reclamo_resuelto. No cambia ningún
    mensaje: solo es otro consumidor. Cada evento avisa una vez por su id.

servers:
  local:
    host: localhost:5680
    protocol: amqp

channels:
  comandos:
    address: abasto.comandos
    messages:
      catalogoReservarStock: { $ref: '#/components/messages/catalogoReservarStock' }
      catalogoLiberarStock: { $ref: '#/components/messages/catalogoLiberarStock' }
      cobrosAutorizarCredito: { $ref: '#/components/messages/cobrosCobrar' }
      cobrosGenerarQr: { $ref: '#/components/messages/cobrosCobrar' }
      cobrosLiberarCredito: { $ref: '#/components/messages/cobrosDevolver' }
      cobrosDevolverQr: { $ref: '#/components/messages/cobrosDevolver' }
  eventos:
    address: abasto.eventos
    messages:
      pedidoCreado: { $ref: '#/components/messages/pedido' }
      pedidoPorConfirmar: { $ref: '#/components/messages/pedido' }
      pedidoConfirmado: { $ref: '#/components/messages/pedidoConfirmado' }
      pedidoRechazado: { $ref: '#/components/messages/pedidoRechazado' }
      pedidoEnEntrega: { $ref: '#/components/messages/pedidoEnEntrega' }
      stockReservado: { $ref: '#/components/messages/stockReservado' }
      stockRechazado: { $ref: '#/components/messages/stockRechazado' }
      stockLiberado: { $ref: '#/components/messages/soloPedido' }
      cobroCreditoAutorizado: { $ref: '#/components/messages/cobroHecho' }
      cobroQrGenerado: { $ref: '#/components/messages/cobroQrGenerado' }
      cobroQrPagado: { $ref: '#/components/messages/cobroHecho' }
      cobroRechazado: { $ref: '#/components/messages/stockRechazado' }
      cobroCreditoLiberado: { $ref: '#/components/messages/soloPedido' }
      cobroQrDevuelto: { $ref: '#/components/messages/soloPedido' }
      cobroPagoRegistrado: { $ref: '#/components/messages/cobroHecho' }
      productoStockCambiado: { $ref: '#/components/messages/productoStockCambiado' }

operations:
  pedidosPideReservar:
    action: send
    channel: { $ref: '#/channels/comandos' }
    summary: Paso 2 de la saga. Lo consume Catálogo (cola catalogo.comandos).
    messages: [{ $ref: '#/channels/comandos/messages/catalogoReservarStock' }]
  pedidosEscuchaRespuestas:
    action: receive
    channel: { $ref: '#/channels/eventos' }
    summary: Cola pedidos.respuestas (stock.* y cobro.*). Mueven la saga.
  asistenteProyecta:
    action: receive
    channel: { $ref: '#/channels/eventos' }
    summary: Cola asistente.proyector (todos los eventos) → base reportes.
  cobrosRegistraMiNegocio:
    action: receive
    channel: { $ref: '#/channels/eventos' }
    summary: >-
      Cola cobros.mi-negocio (solo pedido.entregado) → esquema negocio de Cobros. Con las líneas del pedido arma el
      inventario de «Mi negocio» del cliente (tiendaId): un artículo abasto:<productoId> y una ENTRADA con la clave
      pedido:<pedidoId>:<productoId>:<presentacion> por línea, y un GASTO pedido:<pedidoId> por el total. Repetido no
      duplica. El nombre y el rubro se los pide a Catálogo (_entities) con la cuenta de servicio cobros-servicio.
  cobrosAbreCuentas:
    action: receive
    channel: { $ref: '#/channels/eventos' }
    summary: >-
      (03/11, CU-09) Cola cobros.cuentas (solo pedido.confirmado). Si el pedido es a crédito o contra entrega, Cobros
      abre su cuenta por cobrar (una por pedido; repetido no abre otra). El crédito vence a los plazoDias de la línea
      de la tienda (15 si no tiene); contra entrega se cobra al entregar.

components:
  schemas:
    Sobre:
      type: object
      required: [id, tipo, version, ocurridoEn, orgId, datos]
      properties:
        id: { type: string, format: uuid, description: Único por mensaje; sirve para la idempotencia del consumidor }
        tipo: { type: string, example: pedido.confirmado }
        version: { type: integer, example: 1 }
        ocurridoEn: { type: string, format: date-time }
        correlationId: { type: string, description: El id del pedido de la saga }
        orgId: { type: string, description: Empresa dueña del dato (el mayorista en los pedidos) }
        datos: { type: object }
    Linea:
      type: object
      required: [productoId, presentacion, cantidad]
      properties:
        productoId: { type: string }
        presentacion: { type: string, enum: [UNIDAD, CUARTA, DOCENA, CAJA, FARDO] }
        cantidad: { type: integer, minimum: 1 }
    DatosPedido:
      type: object
      required: [pedidoId, codigo, tiendaId, mayoristaId, metodoPago, totalCentavos]
      properties:
        pedidoId: { type: string, format: uuid }
        codigo: { type: string, example: A-1042 }
        tiendaId: { type: string }
        mayoristaId: { type: string }
        metodoPago: { type: string, enum: [qr, credito, contra_entrega] }
        totalCentavos: { type: integer }
        lineas:
          type: array
          description: >-
            Desde el 01/11 (cambio aditivo): las líneas del pedido. Las usa Cobros con pedido.entregado para
            «Mi negocio». Los eventos de antes no la traen.
          items: { $ref: '#/components/schemas/LineaEntregada' }
    LineaEntregada:
      type: object
      required: [productoId, presentacion, cantidad, unidades, subtotalCentavos]
      properties:
        productoId: { type: string }
        presentacion: { type: string, enum: [UNIDAD, CUARTA, DOCENA, CAJA, FARDO] }
        cantidad: { type: integer, minimum: 1, description: En la presentación (2 docenas) }
        unidades: { type: integer, description: Unidades en total (24) }
        subtotalCentavos: { type: integer, description: Lo que se pagó por la línea }

  messages:
    catalogoReservarStock:
      name: catalogo.reservar_stock
      summary: Reservar el stock de las líneas y devolver el precio por volumen de cada una.
      payload:
        allOf:
          - $ref: '#/components/schemas/Sobre'
          - properties:
              datos:
                type: object
                required: [pedidoId, mayoristaId, tiendaId, lineas]
                properties:
                  pedidoId: { type: string }
                  mayoristaId: { type: string }
                  tiendaId: { type: string, description: Para aplicar la lista de precios de la red privada }
                  lineas: { type: array, items: { $ref: '#/components/schemas/Linea' } }
    catalogoLiberarStock:
      name: catalogo.liberar_stock
      summary: Compensación. Si la reserva ya se liberó, no hace nada.
      payload: { $ref: '#/components/schemas/Sobre' }
    cobrosCobrar:
      name: cobros.autorizar_credito | cobros.generar_qr
      summary: Paso 3 de la saga.
      payload:
        allOf:
          - $ref: '#/components/schemas/Sobre'
          - properties:
              datos:
                type: object
                required: [pedidoId, tiendaId, mayoristaId, centavos]
                properties:
                  pedidoId: { type: string }
                  tiendaId: { type: string }
                  mayoristaId: { type: string }
                  centavos: { type: integer }
    cobrosDevolver:
      name: cobros.liberar_credito | cobros.devolver_qr
      summary: Compensación del cobro.
      payload: { $ref: '#/components/schemas/Sobre' }
    stockReservado:
      name: stock.reservado
      summary: Las líneas en el MISMO orden del comando, cada una con sus unidades y su precio unitario.
      payload:
        allOf:
          - $ref: '#/components/schemas/Sobre'
          - properties:
              datos:
                type: object
                required: [pedidoId, lineas]
                properties:
                  pedidoId: { type: string }
                  lineas:
                    type: array
                    items:
                      type: object
                      required: [unidades, precioUnitarioCentavos]
                      properties:
                        unidades: { type: integer, example: 96 }
                        precioUnitarioCentavos: { type: integer, example: 1800 }
    stockRechazado:
      name: stock.rechazado | cobro.rechazado
      payload:
        allOf:
          - $ref: '#/components/schemas/Sobre'
          - properties:
              datos: { type: object, required: [pedidoId, motivo], properties: { pedidoId: { type: string }, motivo: { type: string } } }
    soloPedido:
      name: stock.liberado | cobro.credito_liberado | cobro.qr_devuelto
      payload: { $ref: '#/components/schemas/Sobre' }
    cobroQrGenerado:
      name: cobro.qr_generado
      summary: >-
        (02/11, aditivo) El QR del pedido ya existe y espera el pago. Lo escucha Conecta para avisarle a la app de la
        tienda en tiempo real; Pedidos y Asistente lo ignoran.
      payload:
        allOf:
          - $ref: '#/components/schemas/Sobre'
          - properties:
              datos:
                type: object
                required: [pedidoId, tiendaId, mayoristaId, centavos, venceEn]
                properties:
                  pedidoId: { type: string }
                  tiendaId: { type: string }
                  mayoristaId: { type: string }
                  centavos: { type: integer }
                  venceEn: { type: string, format: date-time }
    cobroHecho:
      name: cobro.credito_autorizado | cobro.qr_pagado | cobro.pago_registrado
      summary: >-
        cobro.pago_registrado (03/11, CU-09): el mayorista anotó un pago de una cuenta por cobrar. orgId es el
        mayorista. Lo proyecta Asistente (cuentas_por_cobrar); Pedidos lo ignora.
      payload:
        allOf:
          - $ref: '#/components/schemas/Sobre'
          - properties:
              datos:
                type: object
                required: [pedidoId, tiendaId, mayoristaId, centavos]
                properties:
                  pedidoId: { type: string }
                  codigo: { type: string, description: Solo en cobro.pago_registrado (A-1042) }
                  tiendaId: { type: string }
                  mayoristaId: { type: string }
                  centavos: { type: integer, description: Lo autorizado, lo pagado por QR o el pago registrado }
                  forma: { type: string, enum: [EFECTIVO, TRANSFERENCIA, QR], description: Solo en cobro.pago_registrado }
                  saldoCentavos: { type: integer, description: Solo en cobro.pago_registrado; lo que todavía debe }
    pedido:
      name: pedido.creado | pedido.por_confirmar
      payload:
        allOf: [{ $ref: '#/components/schemas/Sobre' }, { properties: { datos: { $ref: '#/components/schemas/DatosPedido' } } }]
    pedidoConfirmado:
      name: pedido.confirmado
      summary: Lo proyecta Asistente (ventas y cuentas por cobrar), Conecta lo manda por webhook y Cobros abre la cuenta por cobrar (cola cobros.cuentas, CU-09).
      payload:
        allOf: [{ $ref: '#/components/schemas/Sobre' }, { properties: { datos: { $ref: '#/components/schemas/DatosPedido' } } }]
    pedidoRechazado:
      name: pedido.rechazado
      payload:
        allOf: [{ $ref: '#/components/schemas/Sobre' }, { properties: { datos: { $ref: '#/components/schemas/DatosPedido' } } }]
    pedidoEnEntrega:
      name: pedido.en_preparacion | pedido.despachado | pedido.entregado
      summary: >-
        El mayorista avanzó la entrega (avanzarEntrega). Lo proyecta Asistente y Conecta lo manda por webhook.
        pedido.entregado además lo consume Cobros (cola cobros.mi-negocio) para el inventario de «Mi negocio».
      payload:
        allOf: [{ $ref: '#/components/schemas/Sobre' }, { properties: { datos: { $ref: '#/components/schemas/DatosPedido' } } }]
    productoStockCambiado:
      name: producto.stock_cambiado
      payload: { $ref: '#/components/schemas/Sobre' }
